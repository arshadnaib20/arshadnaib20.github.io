* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Inter", sans-serif; background: #0E0E0C; color: #EDE8DF; }
header { padding: 24px 6vw; border-bottom: 1px solid #2A2620; background: #161410; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
.brand { font-size: 24px; font-weight: 700; color: #C9A961; }
.brand span { color: #EDE8DF; }
.cart-btn { background:#C9A961; color:#0E0E0C; padding:10px 20px; border-radius:20px; border:none; font-weight:700; cursor:pointer; }
.toolbar { padding: 16px 6vw; display: flex; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; background: #0E0E0C; z-index: 10; border-bottom: 1px solid #2A2620; }
.toolbar input { flex: 1; min-width: 200px; padding: 12px 16px; border-radius: 10px; border: 1px solid #333; background: #1C1A16; color: #fff; }
.toolbar select { padding: 12px; border-radius: 10px; background: #1C1A16; color: #fff; border: 1px solid #333; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; padding: 30px 6vw; }
.card { background: #161410; border: 1px solid #2A2620; border-radius: 14px; overflow: hidden; }
.card .imgwrap { position: relative; aspect-ratio: 4/3; background: #0E0E0C; overflow: hidden; }
.card img { width: 100%; height: 100%; object-fit: cover; }
.card .wm { position: absolute; bottom: 6px; right: 6px; background: rgba(14,14,12,0.85); color: #C9A961; padding: 3px 7px; border-radius: 4px; font-size: 9px; font-weight: 700; letter-spacing: 1px; }
.card .body { padding: 14px; }
.card .cat { font-size: 11px; color: #C9A961; text-transform: uppercase; letter-spacing: 1px; }
.card h3 { font-size: 14px; margin: 6px 0; }
.price-row { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 0; }
.tk { font-size: 20px; color: #C9A961; font-weight: 700; }
.moq { font-size: 12px; color: #888; }
.add { width:100%; padding:10px; background:#C9A961; color:#0E0E0C; border:none; border-radius:8px; font-weight:700; cursor:pointer; margin-top:8px; }
.banner { background: linear-gradient(135deg,#C9A961,#8B6914); color: #0E0E0C; padding: 10px 6vw; font-weight: 600; font-size:14px; }
/* cart drawer */
#drawer { position:fixed; top:0; right:-420px; width:400px; max-width:100vw; height:100vh; background:#161410; border-left:1px solid #2A2620; z-index:200; transition:right .3s; padding:20px; overflow-y:auto; }
#drawer.open { right:0; }
#drawer h2 { color:#C9A961; margin-bottom:16px; }
.citem { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #222; font-size:14px; }
.total { margin-top:16px; font-size:16px; }
.total div { padding:6px 0; }
.checkout { width:100%; padding:14px; background:#C9A961; color:#0E0E0C; border:none; border-radius:10px; font-weight:700; cursor:pointer; margin-top:16px; }
.close { background:none; border:none; color:#888; font-size:22px; cursor:pointer; float:right; }
</style>

  <button class="cart-btn" onclick="openCart()">Cart (<span id="cnt">0</span>)</button>

const RATE = 20.5;
const SHIP_RATE = 1200; // BDT per kg
let cart = JSON.parse(localStorage.getItem('cart')||'[]');

const grid = document.getElementById('grid');
const catFilter = document.getElementById('catFilter');
const cats = [...new Set(RAW.map(p=>p[1]))];
cats.forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; catFilter.appendChild(o); });

function save(){ localStorage.setItem('cart', JSON.stringify(cart)); document.getElementById('cnt').textContent = cart.reduce((a,b)=>a+b.qty,0); }

function add(i){
  const ex = cart.find(c=>c.i===i);
  if(ex) ex.qty++; else cart.push({i, qty:1});
  save();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = catFilter.value;
  grid.innerHTML = '';
  RAW.filter(p => (!cat || p[1]===cat) && (!q || p[0].toLowerCase().includes(q))).forEach((p,i) => {
    const [name, c, rmb, moq, wt, img] = p;
    const sellRmb = rmb * 1.25;
    const bdt = Math.round(sellRmb * RATE);
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<div class="imgwrap">
      <img src="${img}" alt="${name}" loading="lazy">
      <div class="wm">ZARA SOURCING</div>
    </div>
    <div class="body">
      <div class="cat">${c}</div>
      <h3>${name}</h3>
      <div class="price-row"><span class="tk">৳${bdt}</span><span style="color:#888;font-size:12px;">${wt} kg</span></div>
      <div class="moq">MOQ: ${moq} pcs</div>
      <button class="add" onclick="add(${i})">Add to Cart</button>
    </div>`;
    grid.appendChild(div);
  });
}

function openCart(){
  document.getElementById('drawer').classList.add('open');
  renderCart();
}
function closeCart(){ document.getElementById('drawer').classList.remove('open'); }

function renderCart(){
  const el = document.getElementById('citems');
  let items='', sub=0, wt=0;
  cart.forEach(c => {
    const p = RAW[c.i];
    const line = Math.round(p[2]*1.25*RATE) * c.qty;
    sub += line;
    wt += p[4] * c.qty;
    items += `<div class="citem"><span>${p[0]} × ${c.qty}</span><span>৳${line}</span></div>`;
  });
  const ship = Math.ceil(wt) * SHIP_RATE;
  el.innerHTML = items || '<p style="color:#888">Cart is empty</p>';
  document.getElementById('total').innerHTML = `
    <div>Products: ৳${sub}</div>
    <div>Weight: ${wt.toFixed(1)} kg</div>
    <div>Shipping: ৳${ship}</div>
    <div style="font-size:20px;color:#C9A961;font-weight:700;margin-top:8px;">Total: ৳${sub+ship}</div>`;
  window._order = {sub, ship, total: sub+ship, items: cart.map(c=>({name:RAW[c.i][0], qty:c.qty, price:RAW[c.i][2]}))};
}

function sendOrder(){
  if(!cart.length){ alert('Cart is empty'); return; }
  const o = window._order;
  let msg = "Hello Zara Sourcing! I'd like to order:\n";
  o.items.forEach(it => { msg += `• ${it.name} × ${it.qty}\n`; });
  msg += `\nProduct total: ৳${o.sub}\nShipping: ৳${o.ship}\nGrand total: ৳${o.total}`;
  window.open('https://wa.me/8801727067920?text=' + encodeURIComponent(msg));
}

document.getElementById('search').addEventListener('input', render);
catFilter.addEventListener('change', render);
save(); render();
